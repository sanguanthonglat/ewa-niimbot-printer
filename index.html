<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>เอวาชาใต้ - NIIMBOT B21 Printer</title>

  <!-- NIIMBOT Web Bluetooth Driver -->
  <script src="https://cdn.jsdelivr.net/gh/iscarelli/niimbot-web-bluetooth@main/src/niimbot.js"></script>

  <!-- Code 128 -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      background: #f3f4f6;
      color: #111;
      font-family: Arial, "Noto Sans Thai", sans-serif;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 27px;
    }

    .subtitle {
      margin-top: 6px;
      text-align: center;
      color: #666;
      font-size: 14px;
    }

    .status {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
      line-height: 1.5;
    }

    .red {
      background: #ffe4e6;
      color: #b91c1c;
    }

    .green {
      background: #dcfce7;
      color: #166534;
    }

    .yellow {
      background: #fef3c7;
      color: #92400e;
    }

    button {
      width: 100%;
      min-height: 54px;
      margin-top: 12px;
      padding: 13px;
      border: 0;
      border-radius: 13px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .connect {
      background: #1267d6;
      color: #fff;
    }

    .print {
      background: #111;
      color: #fff;
    }

    .print-all {
      background: #047857;
      color: #fff;
    }

    .preview-btn {
      background: #e5e7eb;
      color: #111;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      height: 50px;
      padding: 0 13px;
      border: 1px solid #ccc;
      border-radius: 11px;
      font-size: 17px;
      background: #fff;
    }

    .preview-title {
      text-align: center;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .preview-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      overflow: auto;
    }

    #previewCanvas {
      width: 400px;
      height: 240px;
      max-width: 100%;
      background: #f4d328;
      border: 1px solid #999;
    }

    .size {
      margin-top: 8px;
      text-align: center;
      color: #666;
      font-size: 13px;
    }

    .printer-info {
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      background: #eff6ff;
      font-size: 13px;
      line-height: 1.6;
      word-break: break-word;
    }

    .error {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      background: #fee2e2;
      color: #991b1b;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .batch-box {
      display: none;
      margin-top: 14px;
      padding: 14px;
      border-radius: 14px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
    }

    .batch-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .batch-count {
      font-size: 30px;
      font-weight: bold;
      text-align: center;
      margin: 8px 0;
    }

    .batch-note {
      text-align: center;
      color: #64748b;
      font-size: 13px;
      line-height: 1.5;
    }

    .progress-wrap {
      display: none;
      margin-top: 14px;
    }

    .progress-track {
      width: 100%;
      height: 14px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #047857;
      transition: width .15s ease;
    }

    .progress-text {
      margin-top: 8px;
      text-align: center;
      font-weight: bold;
      font-size: 14px;
    }

    #barcodeCanvas {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- CONNECTION -->
  <div class="card">

    <h1>🖨 NIIMBOT B21</h1>

    <div class="subtitle">
      เอวาชาใต้ • ฉลาก 50 × 30 mm
    </div>

    <div
      id="status"
      class="status red"
    >
      🔴 ยังไม่ได้เชื่อมต่อ
    </div>

    <button
      id="connectBtn"
      class="connect"
      onclick="connectPrinter()"
    >
      🔵 เชื่อมต่อ B21
    </button>

    <div
      id="printerInfo"
      class="printer-info"
    >
      Browser: กำลังตรวจสอบ...
    </div>

    <div
      id="errorBox"
      class="error"
    ></div>

  </div>


  <!-- LABEL DATA -->
  <div class="card">

    <label>
      ชื่อชา
    </label>

    <input
      id="product"
      type="text"
      value="ชาไทย"
      oninput="drawPreview()"
    >


    <label>
      วันที่ผลิต
    </label>

    <input
      id="mfgDate"
      type="date"
      onchange="drawPreview()"
    >


    <label>
      รหัสสินค้า
    </label>

    <input
      id="code"
      type="text"
      value="QR-20261004-0001"
      oninput="drawPreview()"
    >


    <button
      class="preview-btn"
      onclick="drawPreview()"
    >
      🔄 อัปเดตตัวอย่าง
    </button>


    <div
      id="batchBox"
      class="batch-box"
    >

      <div class="batch-title">
        📦 รายการจากระบบผลิต
      </div>

      <div
        id="batchCount"
        class="batch-count"
      >
        0 ใบ
      </div>

      <div
        id="batchNote"
        class="batch-note"
      >
        พร้อมพิมพ์
      </div>

    </div>

  </div>


  <!-- PREVIEW -->
  <div class="card">

    <div class="preview-title">
      ตัวอย่างฉลาก
    </div>

    <div class="preview-wrap">

      <canvas
        id="previewCanvas"
        width="400"
        height="240"
      ></canvas>

    </div>

    <div class="size">
      ฉลากสีเหลือง 50 × 30 mm
    </div>

    <button
      id="printBtn"
      class="print"
      onclick="printCurrentLabel()"
      disabled
    >
      🖨 พิมพ์ใบนี้
    </button>

    <button
      id="printAllBtn"
      class="print-all"
      onclick="printAllLabels()"
      disabled
      style="display:none;"
    >
      ⚡ พิมพ์ทั้งหมด
    </button>


    <div
      id="progressWrap"
      class="progress-wrap"
    >

      <div class="progress-track">

        <div
          id="progressBar"
          class="progress-bar"
        ></div>

      </div>

      <div
        id="progressText"
        class="progress-text"
      >
        0 / 0
      </div>

    </div>

  </div>

</div>


<!-- Barcode work canvas -->
<canvas
  id="barcodeCanvas"
  width="700"
  height="140"
></canvas>


<script>

  // =========================================================
  // B21 CONFIG
  // =========================================================

  const MODEL = {
    name_prefixes: ["B21"],
    task: "b1",
    dpi: 203,
    density: 3,
    label_type: 1,
    speed: 1
  };


  const SIZE = {
    w_px: 384,
    h_px: 240,
    offset_y_px: 4
  };


  // =========================================================
  // GLOBAL
  // =========================================================

  let connected = false;

  let printing = false;

  let labelItems = [];

  let currentIndex = 0;


  // =========================================================
  // START
  // =========================================================

  window.addEventListener(
    "load",
    function() {

      setToday();

      readUrlParameters();

      drawPreview();

      checkEnvironment();

      updateBatchUI();

    }
  );


  // =========================================================
  // ENVIRONMENT
  // =========================================================

  function checkEnvironment() {

    const info =
      document.getElementById(
        "printerInfo"
      );


    if (
      typeof Niimbot === "undefined"
    ) {

      info.innerHTML =
        "❌ โหลด NIIMBOT Driver ไม่สำเร็จ";

      showError(
        "ไม่สามารถโหลด niimbot.js ได้\n" +
        "กรุณาตรวจสอบอินเทอร์เน็ต"
      );

      return;

    }


    if (
      !window.isSecureContext
    ) {

      info.innerHTML =
        "❌ หน้าเว็บไม่ได้ทำงานผ่าน HTTPS";

      showError(
        "Web Bluetooth ต้องเปิดผ่าน HTTPS"
      );

      return;

    }


    if (
      !navigator.bluetooth
    ) {

      info.innerHTML =
        "❌ Browser นี้ไม่มี Web Bluetooth";

      showError(
        "ไม่พบ navigator.bluetooth\n\n" +
        "Android: เปิดหน้านี้ด้วย Chrome โดยตรง\n" +
        "อย่าเปิดจาก LINE / Facebook / WebView"
      );

      return;

    }


    /*
      สำหรับ B1/B21 b1 family
      รักษาค่าที่ปลอดภัยไว้
    */

    if (
      typeof Niimbot.BUNDLE_MAX !==
      "undefined"
    ) {

      Niimbot.BUNDLE_MAX = 240;

    }


    if (
      typeof Niimbot.PACE_MS !==
      "undefined"
    ) {

      Niimbot.PACE_MS = 10;

    }


    info.innerHTML =
      "✅ Web Bluetooth พร้อมใช้งาน" +
      "<br>Driver: " +
      escapeHtml(
        String(
          Niimbot.VERSION ||
          "loaded"
        )
      );

  }


  // =========================================================
  // CONNECT
  // =========================================================

  async function connectPrinter() {

    clearError();


    if (
      typeof Niimbot === "undefined"
    ) {

      showError(
        "NIIMBOT Driver ยังไม่ถูกโหลด"
      );

      return;

    }


    if (
      !navigator.bluetooth
    ) {

      showError(
        "Browser นี้ไม่รองรับ Web Bluetooth"
      );

      return;

    }


    if (printing) {

      showError(
        "กำลังพิมพ์อยู่ กรุณารอให้พิมพ์เสร็จก่อน"
      );

      return;

    }


    setStatus(
      "yellow",
      "🟡 กำลังค้นหา B21..."
    );


    document
      .getElementById(
        "connectBtn"
      )
      .disabled = true;


    try {

      const result =
        await Niimbot.identify(
          MODEL
        );


      connected = true;


      setStatus(
        "green",
        "🟢 เชื่อมต่อเครื่องพิมพ์แล้ว"
      );


      document
        .getElementById(
          "connectBtn"
        )
        .textContent =
          "🔄 เชื่อมต่อใหม่";


      showPrinterInfo(
        result
      );


      updatePrintButtons();

    }
    catch (error) {

      connected = false;


      setStatus(
        "red",
        "🔴 เชื่อมต่อไม่สำเร็จ"
      );


      showError(
        errorText(error)
      );


      updatePrintButtons();

    }
    finally {

      document
        .getElementById(
          "connectBtn"
        )
        .disabled = false;

    }

  }


  // =========================================================
  // PRINTER INFO
  // =========================================================

  function showPrinterInfo(
    result
  ) {

    const detected =
      Niimbot.printer ||
      result ||
      {};


    const modelId =
      detected.modelId != null
        ? detected.modelId
        : "-";


    const protocol =
      detected.protocolVersion != null
        ? detected.protocolVersion
        : "-";


    const task =
      detected.task ||
      "-";


    const dpi =
      detected.dpi ||
      "-";


    document
      .getElementById(
        "printerInfo"
      )
      .innerHTML =

        "✅ Bluetooth เชื่อมต่อแล้ว" +

        "<br>Model ID: <b>" +
        escapeHtml(
          String(modelId)
        ) +
        "</b>" +

        "<br>Protocol: <b>" +
        escapeHtml(
          String(protocol)
        ) +
        "</b>" +

        "<br>Task: <b>" +
        escapeHtml(
          String(task)
        ) +
        "</b>" +

        "<br>DPI: <b>" +
        escapeHtml(
          String(dpi)
        ) +
        "</b>";

  }


  // =========================================================
  // CURRENT INPUT ITEM
  // =========================================================

  function getCurrentInputItem() {

    return {

      productName:
        document
          .getElementById(
            "product"
          )
          .value
          .trim(),

      mfgDate:
        document
          .getElementById(
            "mfgDate"
          )
          .value,

      qrCode:
        document
          .getElementById(
            "code"
          )
          .value
          .trim(),

      quantity: 1

    };

  }


  // =========================================================
  // SET FORM
  // =========================================================

  function setFormFromItem(
    item
  ) {

    if (!item) {
      return;
    }


    document
      .getElementById(
        "product"
      )
      .value =
        item.productName ||
        item.product ||
        "";


    document
      .getElementById(
        "mfgDate"
      )
      .value =
        normalizeDate(
          item.mfgDate ||
          item.date ||
          ""
        );


    document
      .getElementById(
        "code"
      )
      .value =
        item.qrCode ||
        item.code ||
        "";


    drawPreview();

  }


  // =========================================================
  // SINGLE PRINT
  // =========================================================

  async function printCurrentLabel() {

    clearError();


    if (!connected) {

      showError(
        "กรุณาเชื่อมต่อ B21 ก่อน"
      );

      return;

    }


    if (printing) {

      return;

    }


    const item =
      getCurrentInputItem();


    if (
      !validateItem(
        item
      )
    ) {

      return;

    }


    printing = true;

    updatePrintButtons();


    setStatus(
      "yellow",
      "🟡 กำลังพิมพ์..."
    );


    try {

      await printOneItem(
        item
      );


      setStatus(
        "green",
        "✅ พิมพ์เสร็จแล้ว"
      );

    }
    catch (error) {

      setStatus(
        "green",
        "🟢 เครื่องพิมพ์เชื่อมต่ออยู่"
      );


      showError(
        "พิมพ์ไม่สำเร็จ\n\n" +
        errorText(
          error
        )
      );

    }
    finally {

      printing = false;

      updatePrintButtons();

    }

  }


  // =========================================================
  // FAST MULTI PRINT
  //
  // ใช้ printImage ทีละใบ
  // ไม่มี delay ระหว่างใบ
  //
  // จากการทดสอบจริงกับ B21 เครื่องนี้
  // วิธีนี้เร็วกว่า printBatch
  // =========================================================

  async function printAllLabels() {

    clearError();


    if (!connected) {

      showError(
        "กรุณาเชื่อมต่อ B21 ก่อน"
      );

      return;

    }


    if (printing) {

      return;

    }


    if (
      !labelItems ||
      labelItems.length === 0
    ) {

      await printCurrentLabel();

      return;

    }


    // ตรวจข้อมูลก่อนเริ่มทั้งหมด

    for (
      let i = 0;
      i < labelItems.length;
      i++
    ) {

      if (
        !validateItem(
          labelItems[i],
          false
        )
      ) {

        showError(
          "ข้อมูลฉลากใบที่ " +
          (i + 1) +
          " ไม่ครบ"
        );

        return;

      }

    }


    printing = true;

    currentIndex = 0;

    updatePrintButtons();


    showProgress(
      0,
      labelItems.length
    );


    try {

      for (
        let i = 0;
        i < labelItems.length;
        i++
      ) {

        currentIndex = i;


        const item =
          labelItems[i];


        /*
          แสดงข้อมูลใบที่กำลังพิมพ์
        */

        setFormFromItem(
          item
        );


        setStatus(
          "yellow",
          "⚡ กำลังพิมพ์ " +
          (i + 1) +
          " / " +
          labelItems.length
        );


        updatePrintButtons();


        /*
          สำคัญ:
          เริ่มใบถัดไปทันทีหลัง printImage resolve

          ไม่มี:
          - sleep
          - setTimeout
          - delay 700ms
        */

        await printOneItem(
          item
        );


        showProgress(
          i + 1,
          labelItems.length
        );

      }


      setStatus(
        "green",
        "✅ พิมพ์ครบ " +
        labelItems.length +
        " ใบแล้ว"
      );


      document
        .getElementById(
          "progressText"
        )
        .textContent =
          "เสร็จแล้ว " +
          labelItems.length +
          " / " +
          labelItems.length;

    }
    catch (error) {

      setStatus(
        "green",
        "🟢 เครื่องพิมพ์เชื่อมต่ออยู่"
      );


      showError(
        "พิมพ์ไม่สำเร็จที่ใบ " +
        (currentIndex + 1) +
        " / " +
        labelItems.length +
        "\n\n" +
        errorText(
          error
        )
      );

    }
    finally {

      printing = false;

      updatePrintButtons();

    }

  }


  // =========================================================
  // PRINT ONE ITEM
  // =========================================================

  async function printOneItem(
    item
  ) {

    const canvas =
      createPrintCanvas(
        item
      );


    const imageUrl =
      canvas.toDataURL(
        "image/png"
      );


    await Niimbot.printImage(
      imageUrl,
      {
        model: MODEL,
        size: SIZE,
        copies: 1,
        density: 3,

        onProgress:
          function(s) {

            console.log(
              "NIIMBOT",
              s
            );

          }
      }
    );

  }


  // =========================================================
  // VALIDATE
  // =========================================================

  function validateItem(
    item,
    showMessage
  ) {

    if (
      typeof showMessage ===
      "undefined"
    ) {

      showMessage = true;

    }


    if (
      !item ||
      !String(
        item.productName ||
        ""
      ).trim()
    ) {

      if (showMessage) {

        showError(
          "กรุณาระบุชื่อชา"
        );

      }

      return false;

    }


    if (
      !String(
        item.mfgDate ||
        ""
      ).trim()
    ) {

      if (showMessage) {

        showError(
          "กรุณาระบุวันที่ผลิต"
        );

      }

      return false;

    }


    if (
      !String(
        item.qrCode ||
        ""
      ).trim()
    ) {

      if (showMessage) {

        showError(
          "กรุณาระบุรหัสสินค้า"
        );

      }

      return false;

    }


    return true;

  }


  // =========================================================
  // PRINT CANVAS
  // =========================================================

  function createPrintCanvas(
    item
  ) {

    const canvas =
      document.createElement(
        "canvas"
      );


    canvas.width =
      SIZE.w_px;


    canvas.height =
      SIZE.h_px;


    const ctx =
      canvas.getContext(
        "2d"
      );


    ctx.fillStyle =
      "#ffffff";


    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    drawLabel(
      ctx,
      canvas.width,
      canvas.height,
      item,
      false
    );


    return canvas;

  }


  // =========================================================
  // PREVIEW
  // =========================================================

  function drawPreview() {

    const canvas =
      document.getElementById(
        "previewCanvas"
      );


    const ctx =
      canvas.getContext(
        "2d"
      );


    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    ctx.fillStyle =
      "#f4d328";


    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    drawLabel(
      ctx,
      canvas.width,
      canvas.height,
      getCurrentInputItem(),
      true
    );

  }


  // =========================================================
  // DRAW LABEL
  // =========================================================

  function drawLabel(
    ctx,
    width,
    height,
    item,
    preview
  ) {

    item =
      item || {};


    const product =
      String(
        item.productName ||
        item.product ||
        "ชาไทย"
      ).trim();


    const date =
      normalizeDate(
        item.mfgDate ||
        item.date ||
        ""
      );


    const code =
      String(
        item.qrCode ||
        item.code ||
        ""
      ).trim();


    ctx.fillStyle =
      "#000";


    ctx.textAlign =
      "center";


    ctx.textBaseline =
      "middle";


    // PRODUCT

    let productFont = 44;


    if (
      product.length > 18
    ) {

      productFont = 31;

    }
    else if (
      product.length > 13
    ) {

      productFont = 35;

    }
    else if (
      product.length > 9
    ) {

      productFont = 39;

    }


    ctx.font =
      "bold " +
      productFont +
      "px Arial, 'Noto Sans Thai', sans-serif";


    ctx.fillText(
      product,
      width / 2,
      34
    );


    // DATE

    ctx.font =
      "bold 25px Arial, 'Noto Sans Thai', sans-serif";


    ctx.fillText(
      "ผลิต " +
      formatDate(
        date
      ),
      width / 2,
      76
    );


    // BARCODE

    if (code) {

      const barcodeCanvas =
        document.getElementById(
          "barcodeCanvas"
        );


      try {

        JsBarcode(
          barcodeCanvas,
          code,
          {
            format: "CODE128",
            displayValue: false,
            margin: 0,
            width: 2,
            height: 80,
            background: "#ffffff",
            lineColor: "#000000"
          }
        );


        if (preview) {

          ctx.fillStyle =
            "#fff";


          ctx.fillRect(
            12,
            96,
            width - 24,
            88
          );

        }


        ctx.drawImage(
          barcodeCanvas,
          15,
          100,
          width - 30,
          80
        );

      }
      catch (error) {

        console.error(
          "Barcode error",
          error
        );

      }

    }


    // HUMAN READABLE CODE

    ctx.fillStyle =
      "#000";


    let codeFont = 20;


    if (
      code.length > 28
    ) {

      codeFont = 14;

    }
    else if (
      code.length > 24
    ) {

      codeFont = 16;

    }
    else if (
      code.length > 20
    ) {

      codeFont = 18;

    }


    ctx.font =
      "bold " +
      codeFont +
      "px Arial, sans-serif";


    ctx.fillText(
      code,
      width / 2,
      210
    );

  }


  // =========================================================
  // URL PARAMETERS
  // =========================================================

  function readUrlParameters() {

    const params =
      new URLSearchParams(
        window.location.search
      );


    /*
      MULTIPLE LABELS

      ?items=JSON
    */

    const rawItems =
      params.get(
        "items"
      );


    if (rawItems) {

      try {

        const parsed =
          JSON.parse(
            rawItems
          );


        if (
          Array.isArray(
            parsed
          ) &&
          parsed.length > 0
        ) {

          labelItems =
            normalizeItems(
              parsed
            );


          if (
            labelItems.length > 0
          ) {

            currentIndex = 0;


            setFormFromItem(
              labelItems[0]
            );


            return;

          }

        }

      }
      catch (error) {

        console.error(
          "items parameter error",
          error
        );


        showError(
          "อ่านรายการฉลากจากระบบไม่สำเร็จ\n\n" +
          errorText(
            error
          )
        );

      }

    }


    /*
      SINGLE LABEL

      ?product=...
      &date=...
      &code=...
    */

    const product =
      params.get(
        "product"
      );


    const date =
      params.get(
        "date"
      );


    const code =
      params.get(
        "code"
      );


    if (product) {

      document
        .getElementById(
          "product"
        )
        .value =
          product;

    }


    if (date) {

      document
        .getElementById(
          "mfgDate"
        )
        .value =
          normalizeDate(
            date
          );

    }


    if (code) {

      document
        .getElementById(
          "code"
        )
        .value =
          code;

    }


    if (
      product &&
      date &&
      code
    ) {

      labelItems = [
        {
          productName:
            product,

          mfgDate:
            normalizeDate(
              date
            ),

          qrCode:
            code,

          quantity: 1
        }
      ];

    }

  }


  // =========================================================
  // NORMALIZE ITEMS
  // =========================================================

  function normalizeItems(
    items
  ) {

    const result = [];


    for (
      let i = 0;
      i < items.length;
      i++
    ) {

      const source =
        items[i] ||
        {};


      const productName =
        String(
          source.productName ||
          source.product ||
          ""
        ).trim();


      const mfgDate =
        normalizeDate(
          source.mfgDate ||
          source.date ||
          ""
        );


      const qrCode =
        String(
          source.qrCode ||
          source.code ||
          ""
        ).trim();


      const quantity =
        Number(
          source.quantity
        ) || 1;


      if (
        productName &&
        mfgDate &&
        qrCode
      ) {

        result.push(
          {
            productName:
              productName,

            mfgDate:
              mfgDate,

            qrCode:
              qrCode,

            quantity:
              quantity
          }
        );

      }

    }


    return result;

  }


  // =========================================================
  // BATCH UI
  // =========================================================

  function updateBatchUI() {

    const box =
      document.getElementById(
        "batchBox"
      );


    const count =
      document.getElementById(
        "batchCount"
      );


    const note =
      document.getElementById(
        "batchNote"
      );


    const printAll =
      document.getElementById(
        "printAllBtn"
      );


    if (
      labelItems.length > 1
    ) {

      box.style.display =
        "block";


      count.textContent =
        labelItems.length +
        " ใบ";


      note.textContent =
        "Fast Print • พร้อมพิมพ์ " +
        labelItems.length +
        " ใบ";


      printAll.style.display =
        "block";

    }
    else {

      box.style.display =
        "none";


      printAll.style.display =
        "none";

    }


    updatePrintButtons();

  }


  // =========================================================
  // BUTTONS
  // =========================================================

  function updatePrintButtons() {

    const single =
      document.getElementById(
        "printBtn"
      );


    const all =
      document.getElementById(
        "printAllBtn"
      );


    single.disabled =
      !connected ||
      printing;


    all.disabled =
      !connected ||
      printing ||
      labelItems.length <= 1;


    if (printing) {

      single.textContent =
        "⏳ กำลังพิมพ์...";


      if (
        labelItems.length > 1
      ) {

        all.textContent =
          "⚡ กำลังพิมพ์ " +
          (currentIndex + 1) +
          " / " +
          labelItems.length;

      }

    }
    else {

      single.textContent =
        "🖨 พิมพ์ใบนี้";


      all.textContent =
        "⚡ พิมพ์ทั้งหมด " +
        (
          labelItems.length > 1
            ? "(" +
              labelItems.length +
              " ใบ)"
            : ""
        );

    }

  }


  // =========================================================
  // PROGRESS
  // =========================================================

  function showProgress(
    done,
    total
  ) {

    const wrap =
      document.getElementById(
        "progressWrap"
      );


    const bar =
      document.getElementById(
        "progressBar"
      );


    const text =
      document.getElementById(
        "progressText"
      );


    wrap.style.display =
      "block";


    const percent =
      total > 0
        ? Math.round(
            done /
            total *
            100
          )
        : 0;


    bar.style.width =
      percent +
      "%";


    text.textContent =
      done +
      " / " +
      total;

  }


  // =========================================================
  // TODAY
  // =========================================================

  function setToday() {

    const now =
      new Date();


    const yyyy =
      now.getFullYear();


    const mm =
      String(
        now.getMonth() + 1
      ).padStart(
        2,
        "0"
      );


    const dd =
      String(
        now.getDate()
      ).padStart(
        2,
        "0"
      );


    document
      .getElementById(
        "mfgDate"
      )
      .value =
        yyyy +
        "-" +
        mm +
        "-" +
        dd;

  }


  // =========================================================
  // NORMALIZE DATE
  // =========================================================

  function normalizeDate(
    value
  ) {

    if (!value) {

      return "";

    }


    value =
      String(
        value
      ).trim();


    let match =
      value.match(
        /^(\d{4})-(\d{2})-(\d{2})$/
      );


    if (match) {

      return value;

    }


    match =
      value.match(
        /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/
      );


    if (match) {

      return (
        match[3] +
        "-" +
        String(
          match[2]
        ).padStart(
          2,
          "0"
        ) +
        "-" +
        String(
          match[1]
        ).padStart(
          2,
          "0"
        )
      );

    }


    return "";

  }


  // =========================================================
  // FORMAT DATE
  // =========================================================

  function formatDate(
    value
  ) {

    if (!value) {

      return "";

    }


    const match =
      String(
        value
      ).match(
        /^(\d{4})-(\d{2})-(\d{2})$/
      );


    if (!match) {

      return value;

    }


    return (
      match[3] +
      "/" +
      match[2] +
      "/" +
      match[1]
    );

  }


  // =========================================================
  // STATUS
  // =========================================================

  function setStatus(
    type,
    message
  ) {

    const el =
      document.getElementById(
        "status"
      );


    el.className =
      "status " +
      type;


    el.textContent =
      message;

  }


  // =========================================================
  // ERROR
  // =========================================================

  function showError(
    message
  ) {

    const box =
      document.getElementById(
        "errorBox"
      );


    box.style.display =
      "block";


    box.textContent =
      message;

  }


  function clearError() {

    const box =
      document.getElementById(
        "errorBox"
      );


    box.style.display =
      "none";


    box.textContent =
      "";

  }


  // =========================================================
  // ERROR TEXT
  // =========================================================

  function errorText(
    error
  ) {

    if (!error) {

      return "Unknown error";

    }


    if (
      error.message
    ) {

      return error.message;

    }


    return String(
      error
    );

  }


  // =========================================================
  // ESCAPE HTML
  // =========================================================

  function escapeHtml(
    value
  ) {

    return String(
      value
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }
