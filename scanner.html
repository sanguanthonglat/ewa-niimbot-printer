<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

  <title>เอวาชาใต้ - Camera Scanner</title>

  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap"
        rel="stylesheet">

  <style>

    * {
      box-sizing: border-box;
      font-family: 'Kanit', sans-serif;
    }

    body {
      margin: 0;
      padding: 14px;
      background: #fffbed;
      color: #344054;
    }

    .page {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    h1 {
      margin: 0 0 6px;
      text-align: center;
      color: #1e8578;
      font-size: 25px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .camera-box {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      max-height: 65vh;
      background: #000;
      border-radius: 18px;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .guide {
      position: absolute;

      left: 6%;
      right: 6%;

      top: 50%;

      height: 28%;

      transform: translateY(-50%);

      border: 4px solid #efc967;

      border-radius: 14px;

      box-shadow:
        0 0 0 9999px rgba(0,0,0,.20);

      pointer-events: none;
    }

    .guide-line {
      position: absolute;

      left: 8%;
      right: 8%;

      top: 50%;

      height: 3px;

      transform: translateY(-50%);

      background: #efc967;

      box-shadow:
        0 0 10px rgba(239,201,103,.9);
    }

    .status {
      margin-top: 14px;

      padding: 12px;

      border-radius: 12px;

      background: #f8fafc;

      text-align: center;

      font-weight: 600;

      min-height: 48px;

      display: flex;

      align-items: center;

      justify-content: center;
    }

    .status.ready {
      background: #ecfdf5;
      color: #047857;
    }

    .status.error {
      background: #fef2f2;
      color: #dc2626;
    }

    .counter {
      margin-top: 12px;

      padding: 14px;

      border-radius: 14px;

      background: #f0fdfa;

      text-align: center;
    }

    .counter-number {
      color: #1e8578;
      font-size: 30px;
      font-weight: 700;
      line-height: 1;
    }

    .counter-label {
      color: #64748b;
      font-size: 13px;
      margin-top: 5px;
    }

    .last-code {
      margin-top: 12px;

      padding: 12px;

      border: 1px solid #dce3ec;

      border-radius: 12px;

      text-align: center;

      min-height: 48px;
    }

    .last-code-label {
      color: #64748b;
      font-size: 12px;
    }

    .last-code-value {
      margin-top: 3px;

      color: #294d5d;

      font-size: 20px;

      font-weight: 700;

      overflow-wrap: anywhere;
    }

    .close-btn {
      width: 100%;

      min-height: 58px;

      margin-top: 16px;

      border: none;

      border-radius: 14px;

      background: #294d5d;

      color: white;

      font-size: 18px;

      font-weight: 700;

      cursor: pointer;
    }

    .restart-btn {
      width: 100%;

      min-height: 52px;

      margin-top: 10px;

      border: 2px solid #1e8578;

      border-radius: 14px;

      background: white;

      color: #1e8578;

      font-size: 17px;

      font-weight: 700;

      cursor: pointer;

      display: none;
    }

  </style>
</head>

<body>

<div class="page">

  <div class="card">

    <h1>
      📷 สแกนสินค้า
    </h1>

    <div class="subtitle">
      เอวาชาใต้ — เล็ง Barcode ให้อยู่ในกรอบ
    </div>


    <div class="camera-box">

      <video
        id="video"
        autoplay
        muted
        playsinline>
      </video>

      <div class="guide">
        <div class="guide-line"></div>
      </div>

    </div>


    <div
      id="status"
      class="status">
      ⏳ กำลังเปิดกล้อง...
    </div>


    <div class="counter">

      <div
        id="counterNumber"
        class="counter-number">
        0
      </div>

      <div class="counter-label">
        สแกนแล้ว
      </div>

    </div>


    <div class="last-code">

      <div class="last-code-label">
        รหัสล่าสุด
      </div>

      <div
        id="lastCode"
        class="last-code-value">
        -
      </div>

    </div>


    <button
      id="restartBtn"
      class="restart-btn"
      onclick="startScanner()">

      🔄 เปิดกล้องอีกครั้ง

    </button>


    <button
      class="close-btn"
      onclick="finishScanner()">

      ✅ กลับระบบสต็อก

    </button>

  </div>

</div>


<script>

  var video =
    document.getElementById("video");

  var statusBox =
    document.getElementById("status");

  var counterNumber =
    document.getElementById("counterNumber");

  var lastCodeElement =
    document.getElementById("lastCode");

  var restartBtn =
    document.getElementById("restartBtn");


  var stream = null;

  var detector = null;

  var scanning = false;

  var frameRequest = null;


  var scannedCodes = [];

  var lastDetectedCode = "";

  var lastDetectedTime = 0;


  function normalizeCode(value) {

    return String(value || "")
      .trim()
      .replace(/\s+/g, "");

  }


  function setStatus(
    message,
    type
  ) {

    statusBox.textContent =
      message;

    statusBox.className =
      "status";


    if (type) {

      statusBox.classList.add(
        type
      );

    }

  }


  function vibrate() {

    if (!navigator.vibrate) {
      return;
    }

    try {

      navigator.vibrate(
        100
      );

    } catch (error) {

    }

  }


  function sendCodeToStockSystem(
    code
  ) {

    try {

      if (
        window.opener &&
        !window.opener.closed
      ) {

        window.opener.postMessage(
          {
            type:
              "EWA_CAMERA_BARCODE",

            code:
              code
          },
          "*"
        );

        return true;

      }

    } catch (error) {

      console.log(
        "postMessage error",
        error
      );

    }


    return false;

  }


  function addCode(code) {

    code =
      normalizeCode(
        code
      );


    if (!code) {
      return;
    }


    if (
      scannedCodes.indexOf(
        code
      ) !== -1
    ) {

      setStatus(
        "⚠️ " +
        code +
        " สแกนแล้ว",
        "error"
      );

      return;

    }


    scannedCodes.push(
      code
    );


    counterNumber.textContent =
      scannedCodes.length;


    lastCodeElement.textContent =
      code;


    var sent =
      sendCodeToStockSystem(
        code
      );


    if (sent) {

      setStatus(
        "✅ " +
        code +
        " — เล็งถุงถัดไปได้เลย",
        "ready"
      );

    } else {

      setStatus(
        "⚠️ อ่านได้ " +
        code +
        " แต่ไม่พบหน้าระบบสต็อก",
        "error"
      );

    }


    vibrate();

  }


  async function startScanner() {

    restartBtn.style.display =
      "none";


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      setStatus(
        "❌ เบราว์เซอร์นี้ไม่รองรับกล้อง",
        "error"
      );

      restartBtn.style.display =
        "block";

      return;

    }


    if (
      typeof BarcodeDetector ===
      "undefined"
    ) {

      setStatus(
        "❌ Chrome เครื่องนี้ไม่รองรับ Barcode Scanner",
        "error"
      );

      restartBtn.style.display =
        "block";

      return;

    }


    try {

      stopCamera();


      setStatus(
        "⏳ กำลังขอสิทธิ์กล้อง..."
      );


      var formats =
        await BarcodeDetector
          .getSupportedFormats();


      var wanted =
        [];


      if (
        formats.indexOf(
          "code_128"
        ) !== -1
      ) {

        wanted.push(
          "code_128"
        );

      }


      if (
        formats.indexOf(
          "qr_code"
        ) !== -1
      ) {

        wanted.push(
          "qr_code"
        );

      }


      if (
        wanted.length === 0
      ) {

        throw new Error(
          "อุปกรณ์ไม่รองรับ Code128 หรือ QR Code"
        );

      }


      detector =
        new BarcodeDetector({
          formats:
            wanted
        });


      stream =
        await navigator.mediaDevices
          .getUserMedia({

            audio:
              false,

            video: {

              facingMode: {
                ideal:
                  "environment"
              },

              width: {
                ideal:
                  1920
              },

              height: {
                ideal:
                  1080
              }

            }

          });


      video.srcObject =
        stream;


      await video.play();


      scanning =
        true;


      setStatus(
        "📷 พร้อมสแกน — เล็ง Barcode ให้อยู่ในกรอบ",
        "ready"
      );


      detectFrame();


    } catch (error) {

      console.error(
        error
      );


      stopCamera();


      var message =
        error &&
        error.message
          ? error.message
          : String(error);


      if (
        error.name ===
        "NotAllowedError"
      ) {

        setStatus(
          "❌ กรุณาอนุญาตสิทธิ์ Camera ให้เว็บไซต์นี้",
          "error"
        );

      } else {

        setStatus(
          "❌ เปิดกล้องไม่สำเร็จ: " +
          message,
          "error"
        );

      }


      restartBtn.style.display =
        "block";

    }

  }


  async function detectFrame() {

    if (
      !scanning
    ) {
      return;
    }


    try {

      if (
        video.readyState >= 2 &&
        detector
      ) {

        var results =
          await detector.detect(
            video
          );


        if (
          results &&
          results.length > 0
        ) {

          var code =
            normalizeCode(
              results[0].rawValue
            );


          if (code) {

            var now =
              Date.now();


            if (
              code !==
                lastDetectedCode ||
              now -
                lastDetectedTime >
                1800
            ) {

              lastDetectedCode =
                code;

              lastDetectedTime =
                now;


              addCode(
                code
              );

            }

          }

        }

      }

    } catch (error) {

      console.log(
        "detect error",
        error
      );

    }


    if (
      scanning
    ) {

      frameRequest =
        requestAnimationFrame(
          detectFrame
        );

    }

  }


  function stopCamera() {

    scanning =
      false;


    if (
      frameRequest
    ) {

      cancelAnimationFrame(
        frameRequest
      );

      frameRequest =
        null;

    }


    if (
      stream
    ) {

      stream
        .getTracks()
        .forEach(
          function(track) {

            try {

              track.stop();

            } catch (error) {

            }

          }
        );

      stream =
        null;

    }


    if (
      video
    ) {

      video.srcObject =
        null;

    }

  }


  function finishScanner() {

    stopCamera();


    try {

      if (
        window.opener &&
        !window.opener.closed
      ) {

        window.opener.focus();

        window.close();

        return;

      }

    } catch (error) {

    }


    setStatus(
      "สแกนเสร็จแล้ว สามารถกลับไปหน้าระบบสต็อกได้",
      "ready"
    );

  }


  window.addEventListener(
    "pagehide",
    function() {

      stopCamera();

    }
  );


  document.addEventListener(
    "visibilitychange",
    function() {

      if (
        document.visibilityState ===
        "hidden"
      ) {

        stopCamera();

      }

    }
  );


  startScanner();

</script>

</body>
</html>
