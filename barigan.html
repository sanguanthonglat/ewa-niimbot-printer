function formatDisplayDate(value) {
  var text = String(value || '');
  var m = text.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? m[3] + '/' + m[2] + '/' + m[1] : text;
}
  function createBarcodeLabel(item) {
    var canvas = document.createElement('canvas');
    canvas.width = 384;
    canvas.height = 240;
    canvas.className = 'barcode-image';
    canvas.setAttribute('role', 'img');
    canvas.setAttribute('aria-label', 'สติ๊กเกอร์ ' + item.productName + ' Barcode ' + item.qrCode);
    var ctx = canvas.getContext('2d');
    var product = String(item.productName || item.product || 'ชาไทย').trim();
    var code = String(item.qrCode || item.code || '').trim();
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#000';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var productFont = product.length > 18 ? 31 : product.length > 13 ? 35 : product.length > 9 ? 39 : 44;
    ctx.font = "bold " + productFont + "px Arial, 'Noto Sans Thai', sans-serif";
    ctx.fillText(product, canvas.width / 2, 34);
    ctx.font = "bold 25px Arial, 'Noto Sans Thai', sans-serif";
    ctx.fillText('ผลิต ' + formatDisplayDate(item.mfgDate || item.date || ''), canvas.width / 2, 76);
    if (code) {
      var barcode = document.createElement('canvas');
      JsBarcode(barcode, code, {
        format: 'CODE128', displayValue: false, margin: 0, width: 2,
        height: 80, background: '#ffffff', lineColor: '#000000'
      });
      ctx.fillStyle = '#fff';
      ctx.fillRect(12, 96, canvas.width - 24, 88);
      ctx.drawImage(barcode, 15, 100, canvas.width - 30, 80);
    }
    ctx.fillStyle = '#000';
    var codeFont = code.length > 28 ? 14 : code.length > 24 ? 16 : code.length > 20 ? 18 : 20;
    ctx.font = 'bold ' + codeFont + 'px Arial, sans-serif';
    ctx.fillText(code, canvas.width / 2, 210);
    return canvas;
  }


const SERVICE = '000018f0-0000-1000-8000-00805f9b34fb';
const WRITE = '00002af1-0000-1000-8000-00805f9b34fb';
let device = null, writer = null, busy = false, items = [];
let usbDevice = null, usbEndpoint = null, transport = null;
function ready() { return transport === "usb" ? !!(usbDevice && usbDevice.opened && usbEndpoint !== null) : !!writer; }
const status = document.getElementById('status');
let connecting = false;
function updateConnectionStatus() {
  const badge = document.getElementById('connectionStatus');
  const connected = ready();
  badge.className = 'status ' + (connecting ? 'yellow' : connected ? 'green' : 'red');
  badge.textContent = connecting ? '● กำลังเชื่อมต่อ…' : connected ?
    '● เชื่อมต่อแล้ว · ' + (transport === 'usb' ? 'USB' : 'Bluetooth') : '● ยังไม่ได้เชื่อมต่อ';
}

function buttons() {
  updateConnectionStatus();
  document.getElementById('connect').disabled = busy;
  document.getElementById('connectUsb').disabled = busy;
  document.getElementById('test').disabled = busy || !ready();
  document.getElementById('print').disabled = busy || !ready() || !items.length;
  ['gap','offsetX','offsetY','safeMode','packetSize'].forEach(id=>document.getElementById(id).disabled=busy);
}
async function connectPrinter() {
  if (!navigator.bluetooth) { status.textContent = 'เบราว์เซอร์นี้ไม่รองรับ Bluetooth จากเว็บ กรุณาเปิดด้วย Chrome บน Android'; return; }
  busy = true; connecting = true; buttons();
  try {
    status.textContent = 'เลือก BlueTooth Printer ในรายการ';
    device = await navigator.bluetooth.requestDevice({ filters:[{name:'BlueTooth Printer'}], optionalServices:[SERVICE] });
    device.addEventListener('gattserverdisconnected', () => { writer = null; if (transport !== 'bluetooth') return; status.textContent = 'เครื่องพิมพ์ตัดการเชื่อมต่อ กรุณาเชื่อมต่อใหม่'; buttons(); });
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE);
    writer = await service.getCharacteristic(WRITE);
    if (!writer.properties.write && !writer.properties.writeWithoutResponse) throw new Error('ช่อง Bluetooth ไม่รองรับการส่งข้อมูล');
    transport = 'bluetooth';
    status.textContent = ''; 
  } catch (error) { writer = null; status.textContent = 'เชื่อมต่อไม่สำเร็จ: ' + error.message; }
  finally { busy = false; connecting = false; buttons(); }
}
async function connectUsbPrinter() {
  if (busy) return;
  if (!navigator.usb || !window.isSecureContext) {
    status.textContent = 'USB จากเว็บไม่พร้อม กรุณาเปิดหน้านี้ใน Chrome บน Android ผ่าน HTTPS'; return;
  }
  busy = true; connecting = true; buttons();
  let selected = null;
  try {
    // The user chooses the attached printer; never assume a vendor ID or endpoint.
    selected = await navigator.usb.requestDevice({filters: []});
    if (usbDevice && usbDevice !== selected && usbDevice.opened) await usbDevice.close();
    usbDevice = null; usbEndpoint = null; transport = null; writer = null;
    if (device && device.gatt.connected) device.gatt.disconnect();
    await selected.open();
    let chosen = null;
    for (const config of selected.configurations) {
      for (const iface of config.interfaces) {
        for (const alt of iface.alternates) {
          // Only raw USB printer or vendor-specific bulk interfaces are supported.
          if (![7, 255].includes(alt.interfaceClass)) continue;
          const endpoint = alt.endpoints.find(e => e.direction === 'out' && e.type === 'bulk');
          if (endpoint && (!chosen || alt.interfaceClass === 7)) chosen = {config, iface, alt, endpoint};
        }
      }
    }
    if (!chosen) throw new Error('ไม่พบช่อง USB Printer/Bulk ที่รองรับ อุปกรณ์นี้อาจต้องใช้ไดรเวอร์เฉพาะ');
    if (!selected.configuration || selected.configuration.configurationValue !== chosen.config.configurationValue)
      await selected.selectConfiguration(chosen.config.configurationValue);
    await selected.claimInterface(chosen.iface.interfaceNumber);
    await selected.selectAlternateInterface(chosen.iface.interfaceNumber, chosen.alt.alternateSetting);
    usbDevice = selected; usbEndpoint = chosen.endpoint.endpointNumber; transport = 'usb';
    status.textContent = '';
  } catch (error) {
    if (selected && selected !== usbDevice && selected.opened) { try { await selected.close(); } catch (_) {} }
    status.textContent = 'เชื่อมต่อ USB ไม่สำเร็จ: ' + error.message +
      '\nตรวจสายข้อมูล/OTG ปิดแอป Print Label และอนุญาตให้ Chrome ใช้ USB';
  } finally { busy = false; connecting = false; buttons(); }
}
if (navigator.usb) navigator.usb.addEventListener('disconnect', event => {
  if (event.device === usbDevice) {
    usbDevice = null; usbEndpoint = null;
    if (transport === 'usb') status.textContent = 'สาย USB หลุด กรุณาเชื่อมต่อใหม่';
    buttons();
  }
});
function buildTsplJob(canvas, gap, offsetX=0, offsetY=0) {
  // 203 dpi = 8 dots/mm. One label is 400 × 240 dots.
  const raster = document.createElement('canvas'); raster.width = 400; raster.height = 240;
  const ctx = raster.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,400,240);
  ctx.drawImage(canvas,0,0,400,240);
  const rgba = ctx.getImageData(0,0,400,240).data;
  const bitmap = new Uint8Array(50 * 240); bitmap.fill(255);
  for (let y=0;y<240;y++) for(let x=0;x<400;x++) {
    const i=(y*400+x)*4;
    if (rgba[i]*0.299+rgba[i+1]*0.587+rgba[i+2]*0.114 < 160) bitmap[y*50+(x>>3)] &= ~(128>>(x&7));
  }
  const enc = new TextEncoder();
  const head = enc.encode('SIZE 50 mm,30 mm\r\nGAP '+gap+' mm,0 mm\r\nSPEED 4\r\nDIRECTION 0\r\nREFERENCE '+Math.round(offsetX*8)+','+Math.round(offsetY*8)+'\r\nSHIFT 0\r\nCLS\r\nBITMAP 0,0,50,240,0,');
  const tail = enc.encode('\r\nPRINT 1,1\r\n');
  const job = new Uint8Array(head.length+bitmap.length+tail.length);
  job.set(head); job.set(bitmap,head.length); job.set(tail,head.length+bitmap.length); return job;
}
async function sendJob(job) {
  if (transport === 'usb') {
    for (let offset = 0; offset < job.length;) {
      if (!ready()) throw new Error('USB หลุดระหว่างส่งข้อมูล');
      const part = job.subarray(offset, offset + 4096);
      const result = await usbDevice.transferOut(usbEndpoint, part);
      if (result.status !== 'ok' || !result.bytesWritten || result.bytesWritten > part.length)
        throw new Error('ส่ง USB ไม่ครบ: ' + result.status + ' กรุณาตรวจใบที่ออกก่อนพิมพ์ซ้ำ');
      offset += result.bytesWritten;
    }
    return;
  }
  // No automatic retry after a partial transfer. Safe mode uses default-MTU packets.
  const safe=document.getElementById('safeMode').checked;
  const selected=Number(document.getElementById('packetSize').value);
  const packetSize=safe?20:([20,100,180].includes(selected)?selected:20);
  for (let offset=0;offset<job.length;offset+=packetSize) {
    if (!device || !device.gatt.connected || !writer) throw new Error('Bluetooth หลุดระหว่างส่งข้อมูล');
    const part = job.slice(offset,offset+packetSize);
    const fast = !document.getElementById('safeMode').checked && writer.properties.writeWithoutResponse;
    if (fast) {
      await writer.writeValueWithoutResponse(part);
      await new Promise(resolve=>setTimeout(resolve,1));
    } else if (writer.properties.write) await writer.writeValueWithResponse(part);
    else { await writer.writeValueWithoutResponse(part); await new Promise(resolve=>setTimeout(resolve,12)); }
  }
}
async function runPrint(batch) {
  if (busy || !ready() || !batch.length) return;
  const gap = Number(document.getElementById('gap').value);
  if (!Number.isFinite(gap) || gap<0 || gap>10) { status.textContent='กรุณาระบุช่องว่างสติ๊กเกอร์ 0–10 มม.'; return; }
  const offsetX=Number(document.getElementById('offsetX').value), offsetY=Number(document.getElementById('offsetY').value);
  if (!Number.isFinite(offsetX)||offsetX<0||offsetX>15||!Number.isFinite(offsetY)||offsetY<0||offsetY>10) {status.textContent='กรุณาระบุตำแหน่งพิมพ์ในช่วงที่กำหนด';return;}
  busy=true;buttons();document.getElementById('progress').hidden=false;document.getElementById('progressBar').style.width='0%';let completed=0;const started=performance.now();
  try {
    await document.fonts.ready;
    for (const item of batch) {
      status.textContent='กำลังส่งใบที่ '+(completed+1)+' / '+batch.length+' กรุณาเปิดหน้านี้ค้างไว้';
      const labelStarted=performance.now();
      await sendJob(buildTsplJob(createBarcodeLabel(item),gap,offsetX,offsetY));completed++;
      document.getElementById('progressBar').style.width=(completed/batch.length*100)+'%';
      status.textContent='ส่งใบที่ '+completed+' / '+batch.length+' ครบใน '+((performance.now()-labelStarted)/1000).toFixed(1)+' วินาที';
      await new Promise(resolve=>setTimeout(resolve,transport === 'usb' ? 50 : 350));
    }
    status.textContent='ส่งข้อมูลครบ '+completed+' ใบ ใช้เวลารวม '+((performance.now()-started)/1000).toFixed(1)+' วินาที กรุณาตรวจผลที่เครื่องพิมพ์';
  } catch(error) { status.textContent='ส่งไม่ครบ: '+error.message+(transport === 'usb' ? '\nตรวจสาย USB แล้วปิดเปิดเครื่องก่อนลองใหม่\nส่งครบแล้ว ' : '\nหากภาพไม่ครบ ให้เลือก 20 ไบต์หรือส่งแบบช้า แล้วปิดเปิดเครื่อง\nส่งครบแล้ว ')+completed+' ใบ ใบถัดไปอาจส่งไปบางส่วน ตรวจสติ๊กเกอร์ก่อนพิมพ์ซ้ำ'; }
  finally {busy=false;buttons();}
}
function testLabel() { return runPrint([{productName:'ทดสอบชาไทย',mfgDate:new Date().toLocaleDateString('en-GB',{timeZone:'Asia/Bangkok'}),qrCode:'TEST12345678'}]); }
function printLabels() { return runPrint(items); }
(async function init() {
  if (new URLSearchParams(location.search).get('mode') === 'usb') {
    document.getElementById('connectUsb').parentNode.insertBefore(document.getElementById('connectUsb'),document.getElementById('connect'));
    status.textContent = '';
  }
  try {
    const params = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
    const parsed = JSON.parse(params.get('items') || '[]');
    if (!Array.isArray(parsed) || parsed.length>1000 || parsed.some(item=>!item || !/^[\x20-\x7e]+$/.test(String(item.qrCode || '')) || String(item.qrCode).length>100)) throw new Error('ข้อมูล Barcode ไม่ถูกต้อง');
    items=parsed;
    document.getElementById('summary').textContent = items.length ? 'จำนวน '+items.length+' สติ๊กเกอร์ (1 ใบต่อ Barcode)' : 'ไม่มีรายการจากหน้าผลิต สามารถเชื่อมต่อและพิมพ์ทดสอบได้';
    await document.fonts.ready;
    items.forEach(item=>document.getElementById('labels').appendChild(createBarcodeLabel(item)));
  }catch(error){items=[];status.textContent='เปิดรายการไม่ได้: '+error.message;}
  buttons();
})();
